/* ===== SPRING ENGINE: closed-form damped oscillator, mass 1, normalized displacement 0..1 ===== */
(()=>{
const RM=matchMedia("(prefers-reduced-motion: reduce)");
const TOK={"spatial-fast":[.6,800],"spatial-default":[.8,380],"spatial-slow":[.8,200],"effects-fast":[1,3800],"effects-default":[1,1600],"effects-slow":[1,800]};
const pos=(z,k,t)=>{const w=Math.sqrt(k);if(z<1){const d=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(d*t)+z*w/d*Math.sin(d*t))}return 1-Math.exp(-w*t)*(1+w*t)};
const settle=(z,k)=>{let last=0;for(let t=0;t<4;t+=.002)if(Math.abs(pos(z,k,t)-1)>.002)last=t;return last+.002};
const info={};
function build(){
  const root=document.documentElement.style,lin=CSS.supports("transition-timing-function","linear(0,1)");
  for(const[n,[z,k]]of Object.entries(TOK)){
    const T=settle(z,k),N=48,pts=[];
    for(let i=0;i<=N;i++)pts.push(+pos(z,k,T*i/N).toFixed(4));
    pts[N]=1;
    const fb=z<1?`cubic-bezier(.34,${(1+(1-z)*.9).toFixed(2)},.64,1)`:"cubic-bezier(.2,0,0,1)"; /* overshoot fallback where linear() is unsupported */
    root.setProperty(`--m3-${n}`,lin?`linear(${pts.join(",")})`:fb);
    root.setProperty(`--m3-${n}-dur`,RM.matches?"1ms":Math.round(T*1000)+"ms");
    info[n]={z,k,T,pts};
  }
}
/* real-time spring for gestures: sub-steps of 1/120 s, force = -k(x - target) - c*v, c = 2*zeta*sqrt(k), starts from release velocity */
function spring(name,o){
  const[z,k]=TOK[name],{from=0,to=1,v=0,update,done}=o;
  if(RM.matches){update(to);done&&done();return{stop(){}}}
  const c=2*z*Math.sqrt(k),h=1/120,sc=Math.max(1,Math.abs(to-from));
  let p=from,vel=v,last=performance.now(),acc=0,raf,dead=false;
  const step=now=>{
    if(dead)return;
    acc+=Math.min((now-last)/1000,.05);last=now;
    while(acc>=h){vel+=(-k*(p-to)-c*vel)*h;p+=vel*h;acc-=h}
    update(p);
    if(Math.abs(p-to)<.0005*sc&&Math.abs(vel)<.01*sc){update(to);done&&done();return}
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
  return{stop(){dead=true;cancelAnimationFrame(raf)}};
}
build();RM.addEventListener("change",build);
window.GDG={TOK,info,spring,pos,settle,RM};
})();

$("#flows").innerHTML=`<div class="ds" style="padding-bottom:0"><h2 class="t-headline-m">Flow</h2><div class="row wrap" style="gap:var(--sp-6)">${lg("","In-app navigation")}${lg("b","Role routing")}${lg("g","External action")}</div></div>
<div class="fl"><div class="fl-in" style="width:${W}px;height:${H}px">${GR.map((g,r)=>`<div class="fl-band" style="top:${Y0+r*PY-14}px;height:${FH+48}px"><div style="position:absolute;left:20px;top:16px"><div class="t-title-m">${g==="Shared"?"Shared states":g}</div><div class="t-label-m t2">${cnt[r]} screens</div></div></div>`).join("")}
<svg class="map" width="${W}" height="${H}" aria-hidden="true"><defs>${[["ah","--on-surface-3"],["ah-b","--primary"],["ah-g","--brand-green"]].map(([id,c])=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(${c})"/></marker>`).join("")}</defs>${AR.map(a=>`<path class="ar ${a.kind}" d="M${a.pts.map(q=>q.join(" ")).join("L")}" marker-end="url(#ah${a.kind?"-"+a.kind:""})"/><text x="${a.lx}" y="${a.ly}" text-anchor="${a.an}">${a.t}</text>`).join("")}<text x="${busX+10}" y="${runY-8}">Role routing · 3 branches</text></svg>
${pill(at(1,0)[0],FW,"mail","Gmail")}${pill(at(4,0)[0],3*PX-GX,"link","GitHub")}
<div class="fn m3-card-outlined tint blue" style="left:${bx}px;top:${bT}px;height:64px;flex-direction:row;align-items:center;padding:0 var(--sp-3)">${I("emoji_events")}<div><div class="t-title-s">Board</div><div class="t-label-s">shared card</div></div></div>
${SC.map(([,name],i)=>`<div class="fn" data-i="${i}" style="left:${at(...ps[i])[0]}px;top:${at(...ps[i])[1]}px"><div class="tn" inert aria-hidden="true"></div><div class="t-mono t2" style="margin-top:4px;white-space:nowrap">${String(i+1).padStart(2,"0")} ${name}${i>18?SUF[i-19]:""}</div></div>`).join("")}</div></div>`;
document.addEventListener("DOMContentLoaded",()=>$("#flows").querySelectorAll(".fn[data-i]").forEach(n=>{const ph=CE[n.dataset.i].querySelector(".m3-phone").cloneNode(true);ph.classList.add("is-played");$(".tn",n).append(ph)}));

/* opening animation: plays once per session, 300 ms fade under reduced motion */
const o=$(".intro"),H0=document.documentElement;
if(o){
 if(!H0.classList.contains("intro-on"))o.remove();
 else{
  try{sessionStorage.setItem("gdgoc-intro-played","true")}catch(e){}
  const S=n=>cs.getPropertyValue("--m3-"+n).trim()||"ease-out",A=(e,kf,t)=>e.animate(kf,{fill:"both",easing:"linear",...t}),q=c=>$(c,o);
  const ct=[...document.querySelectorAll(".draft-callout,header,main")],L=q(".i-logo"),vw=innerWidth/2,vh=innerHeight/2;
  const end=()=>{ct.forEach(e=>e.getAnimations().forEach(a=>a.cancel()));o.remove()};
  o.classList.add("go");H0.classList.remove("intro-on");
  if(RM.matches){A(L,[{opacity:1},{opacity:0}],{duration:300});ct.forEach(e=>A(e,[{opacity:0},{opacity:1}],{duration:300}));setTimeout(end,350)}
  else{
   A(q(".i-glow"),[{opacity:0},{opacity:1,offset:.18},{opacity:1,offset:.9},{opacity:0}],{duration:1100});
   A(q(".i-scrim"),[{opacity:0},{opacity:0,offset:.36},{opacity:1,offset:.45},{opacity:1,offset:.9},{opacity:0}],{duration:1100});
   A(L,[{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"scale(1)"}],{duration:200});
   A(q(".i-ln i"),[{transform:"scaleX(0)",opacity:1},{transform:"scaleX(1)",opacity:1,offset:.75},{transform:"scaleX(1)",opacity:0}],{delay:200,duration:400});
   A(q(".i-tl"),[{transform:"none",opacity:1},{transform:`translate(${-vw}px,${-vh}px) rotate(-8deg)`,opacity:0}],{delay:500,duration:500,easing:S("spatial-slow")});
   A(q(".i-br"),[{transform:"none",opacity:1},{transform:`translate(${vw}px,${vh}px) rotate(8deg)`,opacity:0}],{delay:500,duration:500,easing:S("spatial-slow")});
   ct.forEach(e=>A(e,[{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{delay:1000,duration:200,easing:S("effects-default")}));
   setTimeout(end,1250)}}}
})();
</script>
</body>
</html>
